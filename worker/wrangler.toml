name = "call-canvas-session-worker"
main = "src/index.js"
compatibility_date = "2026-02-20"
workers_dev = true
routes = [
  { pattern = "api.planeir.ie", custom_domain = true }
]

[[r2_buckets]]
binding = "SESSIONS_BUCKET"
bucket_name = "call-canvas-sessions"
preview_bucket_name = "call-canvas-sessions-preview"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "planeir-leads"
database_id = "b03b1327-a037-4aa3-bc5c-17d8c884d9c8"
preview_database_id = "b03b1327-a037-4aa3-bc5c-17d8c884d9c8"
migrations_dir = "migrations"

# Consumer financial-journey data belongs in a separately provisioned D1
# database. No placeholder database id is committed here. Run
# `wrangler d1 create planeir-consumer`, store the returned id as the
# CONSUMER_DB_ID variable on the protected GitHub `production` environment,
# and let deploy-worker.yml append this block to its ephemeral deploy config:
# [[d1_databases]]
# binding = "CONSUMER_DB"
# database_name = "planeir-consumer"
# database_id = "<real id returned by Cloudflare>"
# migrations_dir = "consumer-migrations"

[durable_objects]
bindings = [
  { name = "CONSUMER_REALTIME_SESSIONS", class_name = "ConsumerRealtimeSession" },
  { name = "CONSUMER_LIVE_SESSIONS", class_name = "ConsumerLiveSession" }
]

# This additive migration provisions the per-call coordinator while the
# committed realtime feature flag remains false. Wrangler applies Durable
# Object migrations atomically with the Worker deployment.
[[migrations]]
tag = "consumer_realtime_sessions_v1"
new_sqlite_classes = ["ConsumerRealtimeSession"]

# The live conversational lane's coordinator. Additive and dormant: the class
# is provisioned so the binding resolves, but no meeting reaches it while
# CONSUMER_LIVE_VOICE_ENABLED is false.
[[migrations]]
tag = "consumer_live_sessions_v1"
new_sqlite_classes = ["ConsumerLiveSession"]

[triggers]
crons = ["5 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://geraldboylan01.github.io,https://planeir.ie,https://www.planeir.ie"
SESSION_ADVISOR_NOTIFICATION_TO = "geraldboylan@gmail.com"
TRUSTPILOT_AFS_EMAIL = "planeir.ie+c36359b3d5@invite.trustpilot.com"
# Consumer journey ships dormant. Enable each capability deliberately after the
# separate consumer database, consumer migration 0001, adviser migration 0014,
# approved policies, and required secrets are present.
CONSUMER_JOURNEY_ENABLED = "false"
CONSUMER_AI_INTAKE_ENABLED = "false"
CONSUMER_VOICE_ENABLED = "false"
CONSUMER_REALTIME_VOICE_ENABLED = "false"
# Direct speech-to-speech plus the silent Responses planner. This independent
# kill switch deliberately defaults off so the controlled v1 journey remains
# an immediate rollback path.
CONSUMER_REALTIME_CONVERSATION_V2_ENABLED = "false"
CONSUMER_REALTIME_SPOKEN_COMPLETION_ENABLED = "false"
# The live conversational lane. Independent of the v1/v2 switch above: the two
# are alternative conversation layers over the same lease, consent and cost
# infrastructure, and exactly one drives a given meeting. Ships false.
CONSUMER_LIVE_VOICE_ENABLED = "false"
CONSUMER_MODULE_ROUTING_ENABLED = "false"
CONSUMER_GOAL_ROUTING_ENABLED = "false"
# Offering an optional analysis, and the three-analysis capacity decision that
# follows when a fourth becomes relevant. ONE shared rule across every
# transport: on means all offer, off means none does. Defaults off so the
# corrected flow is validated in the consumer-test environment and canaried on
# voice separately. Rollback is this flag alone.
CONSUMER_MODULE_OFFERS_ENABLED = "false"
# The protected agent-test transport. A testing facility, never a public typed
# consumer journey. Off in production.
CONSUMER_AGENT_TEST_ENABLED = "false"
# A8 double gate. Even if CONSUMER_AGENT_TEST_ENABLED were flipped true on a
# deployment -- including straight in the Cloudflare dashboard, which bypasses
# the deploy-time checks entirely -- the agent transport still refuses unless
# this deployment's CONSUMER_COHORT is named here. Production runs "internal".
CONSUMER_AGENT_TEST_COHORTS = "automated_test,consumer_test"
CONSUMER_HANDOFF_ENABLED = "false"
CONSUMER_PUBLIC_ACCESS_ENABLED = "false"
# Every module that passes all four consumer gates in the manifest
# (runnable engine, platform approval, adviser enablement, client language).
# This was pinned to two modules on the first day of the adviser beta, before
# the manifest governance model existed, and never widened as modules were
# approved -- so a client asking about their overall position or their
# children's education was routed to nothing at all.
CONSUMER_ALLOWED_MODULE_IDS = "college_funding,house_purchase,liquidity_analysis,loan_analysis,mortgage_analysis,pension_projection,personal_balance_sheet"
CONSUMER_COHORT = "internal"
CONSUMER_CONSENT_POLICY_VERSION = "consumer-v1"
CONSUMER_CONSENT_MANIFEST_ID = ""
# Empty notice identifiers and URL deliberately keep consented analysis and AI
# processing fail closed until the exact published notices are approved.
CONSUMER_ANALYSIS_NOTICE_ID = ""
CONSUMER_AI_NOTICE_ID = ""
CONSUMER_VOICE_NOTICE_ID = ""
CONSUMER_PRIVACY_NOTICE_URL = ""
# This duration is not a legal-policy decision. Keep the journey disabled until
# the value and the consent-policy version have been explicitly approved.
CONSUMER_SESSION_TTL_DAYS = "30"
CONSUMER_MAX_MESSAGE_LENGTH = "4000"
CONSUMER_MAX_TURNS_PER_SESSION = "80"
CONSUMER_DATA_ENCRYPTION_KEY_ID = "consumer-v1"
CONSUMER_REKEY_BATCH_SIZE = "25"
CONSUMER_INVITE_MAX_TTL_HOURS = "168"
# Empty policy identifiers deliberately keep AI and handoff fail closed even if
# their feature flags are accidentally changed.
CONSUMER_AI_DATA_POLICY_ID = ""
CONSUMER_VOICE_DATA_POLICY_ID = ""
CONSUMER_VOICE_TRANSCRIPTION_MODEL = ""
CONSUMER_VOICE_SPEECH_MODEL = ""
CONSUMER_VOICE_NAME = ""
CONSUMER_VOICE_PRICING_VERSION = ""
CONSUMER_VOICE_TIMEOUT_MS = "25000"
CONSUMER_VOICE_MAX_AUDIO_BYTES = "1000000"
CONSUMER_VOICE_MAX_DURATION_SECONDS = "45"
CONSUMER_VOICE_MAX_SPEECH_CHARACTERS = "1200"
# Voice budgets are integer euro cents. Zero is the fail-closed dormant value;
# the production workflow supplies the reviewed adviser-test limits ephemerally.
CONSUMER_VOICE_SESSION_BUDGET_EUR_CENTS = "0"
CONSUMER_VOICE_DAILY_BUDGET_EUR_CENTS = "0"
CONSUMER_VOICE_TRANSCRIPTION_RESERVATION_EUR_CENTS = "0"
CONSUMER_VOICE_SPEECH_RESERVATION_EUR_CENTS = "0"
# Realtime is independently consented and kill-switchable. Empty policy/model
# identifiers, zero budgets, and the false flag are the fail-closed source
# values; deploy-worker.yml overlays the reviewed adviser-canary contract only
# in its ephemeral production config.
CONSUMER_REALTIME_NOTICE_ID = ""
CONSUMER_REALTIME_DATA_POLICY_ID = ""
CONSUMER_REALTIME_MODEL = ""
CONSUMER_REALTIME_VOICE = ""
CONSUMER_REALTIME_REASONING_EFFORT = ""
CONSUMER_REALTIME_TRANSCRIPTION_MODEL = ""
CONSUMER_REALTIME_PROMPT_VERSION = ""
CONSUMER_REALTIME_TOOLSET_VERSION = ""
CONSUMER_REALTIME_PRICING_VERSION = ""
CONSUMER_REALTIME_SESSION_BUDGET_EUR_CENTS = "0"
CONSUMER_REALTIME_SESSION_WARN_EUR_CENTS = ""
CONSUMER_REALTIME_DAILY_BUDGET_EUR_CENTS = "0"
CONSUMER_REALTIME_MAX_DURATION_SECONDS = "600"
CONSUMER_REALTIME_IDLE_TIMEOUT_SECONDS = "90"
CONSUMER_REALTIME_SILENCE_PROMPT_SECONDS = "45"
CONSUMER_REALTIME_MAX_SDP_BYTES = "32768"
CONSUMER_REALTIME_MAX_RESPONSES = "100"
CONSUMER_REALTIME_MAX_TOOL_CALLS = "60"
CONSUMER_REALTIME_PLANNER_TIMEOUT_MS = "8000"
CONSUMER_REALTIME_PLANNER_CATCHUP_TIMEOUT_MS = "12000"
CONSUMER_REALTIME_PLANNER_PROMPT_VERSION = "realtime-planner-v5"
# The background note reconciler. "legacy" keeps the original single-turn
# auditor, "shadow" records what it would change without writing, and "apply"
# commits the operations its deterministic validator accepted. It never runs
# before the assistant speaks, so this only changes what happens after a turn.
# An unset or misspelled value falls back to legacy.
CONSUMER_PLANNER_RECONCILIATION_MODE = "legacy"
CONSUMER_PLANNER_RECONCILIATION_PROMPT_VERSION = "planning-reconciliation-v3"
# The silent planner has its own approved model, validated against a
# server-side allowlist. It previously inherited the AI-intake default model,
# so retuning intake silently retuned the planner.
CONSUMER_REALTIME_PLANNER_MODEL = "gpt-5.6-luna"
# The conversation director phrases Worker-owned speech with a bounded text
# model call and falls back to the deterministic templates on any failure.
# Fail closed here; the deploy workflow enables it for the adviser canary.
CONSUMER_REALTIME_DIRECTOR_ENABLED = "false"
CONSUMER_REALTIME_TEXT_INPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_TEXT_CACHED_INPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_TEXT_OUTPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_AUDIO_INPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_AUDIO_CACHED_INPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_AUDIO_OUTPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_TRANSCRIPTION_INPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_TRANSCRIPTION_OUTPUT_EUR_MICROS_PER_MILLION = "0"
CONSUMER_REALTIME_SPEECH_EUR_MICROS_PER_MILLION_CHARACTERS = "0"
CONSUMER_AI_DEFAULT_MODEL = "gpt-5.6-luna"
CONSUMER_AI_COMPLEX_MODEL = "gpt-5.6-terra"
CONSUMER_AI_DEFAULT_REASONING_EFFORT = "low"
CONSUMER_AI_COMPLEX_REASONING_EFFORT = "medium"
CONSUMER_AI_PROMPT_VERSION = "consumer-intake-goal-routing-v2"
CONSUMER_AI_TIMEOUT_MS = "15000"
CONSUMER_AI_MAX_OUTPUT_TOKENS = "1200"
CONSUMER_AI_REQUEST_TOKEN_RESERVATION = "8000"
CONSUMER_AI_SESSION_REQUEST_BUDGET = "24"
CONSUMER_AI_DAILY_REQUEST_BUDGET = "1000"
CONSUMER_AI_COMPLEX_SESSION_REQUEST_BUDGET = "4"
CONSUMER_AI_COMPLEX_DAILY_REQUEST_BUDGET = "100"
CONSUMER_AI_SESSION_TOKEN_BUDGET = "25000"
CONSUMER_AI_DAILY_TOKEN_BUDGET = "250000"
CONSUMER_HANDOFF_POLICY_VERSION = ""
CONSUMER_HANDOFF_POLICY_URL = ""
CONSUMER_HANDOFF_RETENTION_POLICY_ID = ""
CONSUMER_HANDOFF_RETENTION_DAYS = ""
CONSUMER_BOOKING_URL = ""
# Learning-signals telemetry (integration Phase 1). ALL THREE must be set for a
# finished call to emit a minimised summary to the learning-signal service;
# leave any blank and the emitter is a complete no-op. LEARNING_SIGNALS_URL and
# LEARNING_SIGNALS_MODULE_ID may live here per-environment; set
# LEARNING_SIGNALS_INGEST_KEY (a tenant `ingest` key) with `wrangler secret put`.
LEARNING_SIGNALS_URL = "https://planeir-learning-signals.onrender.com"
LEARNING_SIGNALS_MODULE_ID = "b864ca8f-fc74-4f5d-810c-cda8751be4a8"
LEARNING_SIGNALS_RETENTION_DAYS = "30"
# Set with `wrangler secret put`: CONSUMER_DATA_ENCRYPTION_KEY,
# CONSUMER_DATA_ENCRYPTION_PREVIOUS_KEYS_JSON (during rotations),
# CONSUMER_INVITE_SIGNING_KEY (for private cohorts),
# CONSUMER_RATE_LIMIT_HASH_KEY (a separate 32-byte base64url key), OPENAI_API_KEY
# (server-side AI or voice provider credential only),
# LEARNING_SIGNALS_INGEST_KEY (a tenant `ingest` key for the learning-signal service),
# LEARNING_SIGNALS_READ_KEY (a tenant `read` key; powers the advisor analytics
# dashboard via /api/advisor/analytics/*. Never exposed to the browser).
