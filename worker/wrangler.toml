name = "call-canvas-session-worker"
main = "src/index.js"
compatibility_date = "2026-02-20"
workers_dev = true

[[r2_buckets]]
binding = "SESSIONS_BUCKET"
bucket_name = "call-canvas-sessions"
preview_bucket_name = "call-canvas-sessions-preview"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "planeir-leads"
database_id = "b03b1327-a037-4aa3-bc5c-17d8c884d9c8"
preview_database_id = "b03b1327-a037-4aa3-bc5c-17d8c884d9c8"
migrations_dir = "migrations"

# Consumer financial-journey data belongs in a separately provisioned D1
# database. No placeholder database id is committed here. Run
# `wrangler d1 create planeir-consumer`, store the returned id as the
# CONSUMER_DB_ID variable on the protected GitHub `production` environment,
# and let deploy-worker.yml append this block to its ephemeral deploy config:
# [[d1_databases]]
# binding = "CONSUMER_DB"
# database_name = "planeir-consumer"
# database_id = "<real id returned by Cloudflare>"
# migrations_dir = "consumer-migrations"

[triggers]
crons = ["5 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://geraldboylan01.github.io,https://planeir.ie,https://www.planeir.ie"
SESSION_ADVISOR_NOTIFICATION_TO = "geraldboylan@gmail.com"
TRUSTPILOT_AFS_EMAIL = "planeir.ie+c36359b3d5@invite.trustpilot.com"
# Consumer journey ships dormant. Enable each capability deliberately after the
# separate consumer database, consumer migration 0001, adviser migration 0014,
# approved policies, and required secrets are present.
CONSUMER_JOURNEY_ENABLED = "false"
CONSUMER_AI_INTAKE_ENABLED = "false"
CONSUMER_MODULE_ROUTING_ENABLED = "false"
CONSUMER_HANDOFF_ENABLED = "false"
CONSUMER_PUBLIC_ACCESS_ENABLED = "false"
CONSUMER_ALLOWED_MODULE_IDS = "house_purchase,liquidity_analysis"
CONSUMER_COHORT = "internal"
CONSUMER_CONSENT_POLICY_VERSION = "consumer-v1"
CONSUMER_CONSENT_MANIFEST_ID = ""
# Empty notice identifiers and URL deliberately keep consented analysis and AI
# processing fail closed until the exact published notices are approved.
CONSUMER_ANALYSIS_NOTICE_ID = ""
CONSUMER_AI_NOTICE_ID = ""
CONSUMER_PRIVACY_NOTICE_URL = ""
# This duration is not a legal-policy decision. Keep the journey disabled until
# the value and the consent-policy version have been explicitly approved.
CONSUMER_SESSION_TTL_DAYS = "30"
CONSUMER_MAX_MESSAGE_LENGTH = "4000"
CONSUMER_MAX_TURNS_PER_SESSION = "80"
CONSUMER_DATA_ENCRYPTION_KEY_ID = "consumer-v1"
CONSUMER_REKEY_BATCH_SIZE = "25"
CONSUMER_INVITE_MAX_TTL_HOURS = "168"
# Empty policy identifiers deliberately keep AI and handoff fail closed even if
# their feature flags are accidentally changed.
CONSUMER_AI_DATA_POLICY_ID = ""
CONSUMER_AI_DEFAULT_MODEL = "gpt-5.6-luna"
CONSUMER_AI_COMPLEX_MODEL = "gpt-5.6-terra"
CONSUMER_AI_DEFAULT_REASONING_EFFORT = "low"
CONSUMER_AI_COMPLEX_REASONING_EFFORT = "medium"
CONSUMER_AI_PROMPT_VERSION = "consumer-intake-v1"
CONSUMER_AI_TIMEOUT_MS = "15000"
CONSUMER_AI_MAX_OUTPUT_TOKENS = "1200"
CONSUMER_AI_REQUEST_TOKEN_RESERVATION = "8000"
CONSUMER_AI_SESSION_REQUEST_BUDGET = "24"
CONSUMER_AI_DAILY_REQUEST_BUDGET = "1000"
CONSUMER_AI_COMPLEX_SESSION_REQUEST_BUDGET = "4"
CONSUMER_AI_COMPLEX_DAILY_REQUEST_BUDGET = "100"
CONSUMER_AI_SESSION_TOKEN_BUDGET = "25000"
CONSUMER_AI_DAILY_TOKEN_BUDGET = "250000"
CONSUMER_HANDOFF_POLICY_VERSION = ""
CONSUMER_HANDOFF_POLICY_URL = ""
CONSUMER_HANDOFF_RETENTION_POLICY_ID = ""
CONSUMER_HANDOFF_RETENTION_DAYS = ""
CONSUMER_BOOKING_URL = ""
# Set with `wrangler secret put`: CONSUMER_DATA_ENCRYPTION_KEY,
# CONSUMER_DATA_ENCRYPTION_PREVIOUS_KEYS_JSON (during rotations),
# CONSUMER_INVITE_SIGNING_KEY (for private cohorts),
# CONSUMER_RATE_LIMIT_HASH_KEY (a separate 32-byte base64url key), OPENAI_API_KEY.
