name = "call-canvas-consumer-test-worker"
main = "src/index.js"
compatibility_date = "2026-02-20"
workers_dev = false

[[r2_buckets]]
binding = "SESSIONS_BUCKET"
bucket_name = "call-canvas-consumer-test-sessions"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "planeir-leads-consumer-test"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[[d1_databases]]
binding = "CONSUMER_DB"
database_name = "planeir-consumer-test"
database_id = "00000000-0000-4000-8000-000000000002"
migrations_dir = "consumer-migrations"

[[durable_objects.bindings]]
name = "CONSUMER_REALTIME_SESSIONS"
class_name = "ConsumerRealtimeSession"

[[migrations]]
tag = "consumer_realtime_sessions_v1"
new_sqlite_classes = ["ConsumerRealtimeSession"]

[triggers]
crons = ["5 * * * *"]

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:5500"
ALLOW_LOCAL_DEV_ORIGINS = "true"
CONSUMER_JOURNEY_ENABLED = "true"
CONSUMER_AI_INTAKE_ENABLED = "false"
CONSUMER_VOICE_ENABLED = "false"
CONSUMER_REALTIME_VOICE_ENABLED = "false"
CONSUMER_MODULE_ROUTING_ENABLED = "true"
CONSUMER_HANDOFF_ENABLED = "true"
CONSUMER_PUBLIC_ACCESS_ENABLED = "false"
CONSUMER_ALLOWED_MODULE_IDS = "house_purchase,liquidity_analysis"
CONSUMER_COHORT = "automated_test"
CONSUMER_CONSENT_POLICY_VERSION = "consumer-test-v1"
CONSUMER_CONSENT_MANIFEST_ID = "consumer-test-manifest-v1"
CONSUMER_ANALYSIS_NOTICE_ID = "analysis-test-v1"
CONSUMER_AI_NOTICE_ID = "ai-test-v1"
CONSUMER_VOICE_NOTICE_ID = "voice-test-v1"
CONSUMER_PRIVACY_NOTICE_URL = "https://planeir.ie/plan/privacy.html"
