<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787 https://call-canvas-session-worker.geraldboylan.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    />
    <meta
      name="call-canvas-worker-base-url"
      content="https://call-canvas-session-worker.geraldboylan.workers.dev"
    />
    <meta
      name="planeir-google-review-url"
      content=""
    />
    <meta
      name="description"
      content="Planeir client session viewer for secure read-only planning conversations."
    />
    <title>Planeir Client Session</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="../styles/base.css" />
  </head>
  <body>
    <div id="sessionUnlockLayer" class="session-unlock-layer" role="dialog" aria-modal="true" aria-labelledby="sessionUnlockTitle">
      <div class="session-unlock-card">
        <h1 id="sessionUnlockTitle">Client session</h1>
        <p id="sessionUnlockHint" class="session-unlock-hint">Checking your secure link.</p>
        <div id="sessionPinGroup" class="is-hidden" aria-hidden="true">
          <input
            id="sessionPinInput"
            class="session-unlock-input"
            type="password"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="000000"
            aria-label="PIN"
          />
          <input
            id="sessionPinConfirmInput"
            class="session-unlock-input is-hidden"
            type="password"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="Confirm PIN"
            aria-label="Confirm PIN"
          />
        </div>
        <div class="session-unlock-actions">
          <button id="sessionUnlockBtn" class="ui-button" type="button">Unlock</button>
        </div>
        <p id="sessionUnlockError" class="session-unlock-error" aria-live="polite"></p>
      </div>
    </div>

    <div
      id="googleReviewLayer"
      class="session-unlock-layer google-review-layer is-hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="googleReviewTitle"
      aria-hidden="true"
    >
      <div class="session-unlock-card google-review-card">
        <p class="google-review-eyebrow">Before you continue</p>
        <h1 id="googleReviewTitle">Would you leave a Google review?</h1>
        <p class="session-unlock-hint google-review-copy">
          If today's session was useful, an honest Google review helps other clients know what to expect.
        </p>
        <div class="session-unlock-actions google-review-actions">
          <button id="googleReviewBtn" class="ui-button google-review-primary" type="button">Leave a Google review</button>
          <button id="googleReviewContinueBtn" class="ui-button" type="button">Continue to session</button>
        </div>
      </div>
    </div>

    <div id="app">
      <header class="topbar" aria-label="Session controls">
        <div class="topbar-left">
          <a class="app-home-link" href="../" aria-label="Return to Planeir website">
            <img
              class="app-home-link-image"
              src="../assets/brand/planeir-wordmark-light.svg"
              alt=""
              width="1330"
              height="384"
              decoding="async"
            />
          </a>
          <input
            id="clientNameInput"
            class="topbar-input"
            type="text"
            value="Client"
            aria-label="Client name"
            placeholder="Client name"
          />
        </div>
        <div class="topbar-right">
          <button id="zoomToggleBtn" class="ui-button" type="button">Zoom Out</button>
          <div class="mobile-topbar-meta">
            <span id="sessionStatus" class="session-status">Read only</span>
          </div>
        </div>
      </header>

      <nav id="mobileFocusNav" class="mobile-focus-nav is-hidden" aria-label="Module navigation">
        <button
          id="mobileFocusModulesBtn"
          class="ui-button mobile-focus-nav-btn is-primary"
          type="button"
          aria-haspopup="dialog"
          aria-controls="mobileModulePanel"
          aria-expanded="false"
        >
          <span class="mobile-focus-nav-icon" aria-hidden="true">&#9776;</span>
          <span class="mobile-focus-nav-label">Modules</span>
        </button>
        <button id="mobileFocusPrevBtn" class="ui-button mobile-focus-nav-btn" type="button">
          <span class="mobile-focus-nav-icon" aria-hidden="true">&#8592;</span>
          <span class="mobile-focus-nav-label">Previous</span>
        </button>
        <button id="mobileFocusNextBtn" class="ui-button mobile-focus-nav-btn" type="button">
          <span class="mobile-focus-nav-label">Next</span>
          <span class="mobile-focus-nav-icon" aria-hidden="true">&#8594;</span>
        </button>
      </nav>

      <main class="main-viewport" aria-live="polite">
        <section id="greetingLayer" class="layer greeting-view">
          <h1 id="greetingHeadline" class="greeting-headline">Client Session</h1>
        </section>

        <section id="focusLayer" class="layer focused-view is-hidden" aria-label="Focused module view" aria-hidden="true">
          <div id="swipeStage" class="swipe-stage"></div>
          <button
            id="navPrevBtn"
            class="nav-arrow left"
            type="button"
            aria-label="Previous module"
            title="Previous module"
          >
            &#8592;
          </button>
          <button
            id="navNextBtn"
            class="nav-arrow right"
            type="button"
            aria-label="Next module"
            title="Next module"
          >
            &#8594;
          </button>
        </section>

        <section id="overviewLayer" class="layer overview-view is-hidden" aria-label="Overview map" aria-hidden="true">
          <div id="overviewViewport" class="overview-viewport">
            <div id="overviewZoomWrap" class="overview-zoom-wrap">
              <div id="overviewGrid" class="overview-grid"></div>
            </div>
          </div>
        </section>

        <div id="animLayer" class="anim-layer" aria-hidden="true"></div>
        <div id="toastHost" class="toast-host" aria-live="polite"></div>
      </main>

      <div id="mobileModuleSheet" class="mobile-module-sheet" aria-hidden="true">
        <div id="mobileModuleBackdrop" class="mobile-module-backdrop"></div>
        <div
          id="mobileModulePanel"
          class="mobile-module-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="mobileModuleTitle"
        >
          <div class="mobile-module-grabber" aria-hidden="true"></div>
          <div class="mobile-module-header">
            <div class="mobile-module-heading">
              <p class="mobile-module-eyebrow">Session navigation</p>
              <h2 id="mobileModuleTitle" class="mobile-module-title">Modules</h2>
              <p class="mobile-module-subtitle">Jump to any module in the session.</p>
            </div>
            <button id="mobileModuleCloseBtn" class="ui-button mobile-module-close-btn" type="button">Done</button>
          </div>
          <div id="mobileModuleList" class="mobile-module-list" role="list"></div>
        </div>
      </div>
    </div>

    <script src="../js/vendor/chart.umd.min.js"></script>
    <script src="../js/vendor/Sortable.min.js"></script>
    <script type="module" src="../js/session_viewer.js"></script>
  </body>
</html>
