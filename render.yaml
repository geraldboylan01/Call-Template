# Render Blueprint for the learning-signal telemetry service. The long-term
# database is external Neon PostgreSQL; this Blueprint manages only the Render
# web service running the Dockerfile in services/learning-signals.
#
# DATABASE_URL is deliberately a dashboard-managed secret (`sync: false`), so
# Blueprint syncs never put a connection string in git or rebind the service to
# a Render database. See services/learning-signals/HOSTING.md for setup,
# migration, cutover, and rollback instructions.
#
# Free-tier notes: the web service spins down after ~15 min idle (warm it with
# GET /health before a test call); confirm current free-tier terms with Render.
services:
  - type: web
    name: planeir-learning-signals
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: services/learning-signals/Dockerfile
    dockerContext: services/learning-signals
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
