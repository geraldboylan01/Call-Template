<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Planeir Success Animation Preview</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/success_takeover.css?v=harp-character-qa" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
      }

      .success-preview-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .success-preview-header {
        min-height: 64px;
        display: flex;
        align-items: center;
        padding: 12px clamp(18px, 4vw, 48px);
        border-bottom: 1px solid rgba(143, 208, 255, 0.16);
        background: rgba(6, 13, 25, 0.8);
      }

      .success-preview-origin {
        display: block;
        width: 150px;
        aspect-ratio: 1330 / 384;
      }

      .success-preview-origin img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .success-preview-main {
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .success-preview-panel {
        width: min(620px, 100%);
        display: grid;
        gap: 18px;
        padding: clamp(20px, 4vw, 34px);
        border: 1px solid rgba(143, 208, 255, 0.2);
        border-radius: 24px;
        background: rgba(8, 18, 34, 0.86);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      }

      .success-preview-panel h1,
      .success-preview-panel p {
        margin: 0;
      }

      .success-preview-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .success-preview-field {
        display: grid;
        gap: 7px;
        color: #bfd3e8;
        font-size: 0.82rem;
      }

      .success-preview-field select {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid rgba(143, 208, 255, 0.26);
        border-radius: 10px;
        background: #0a182b;
        color: #f3f8ff;
      }

      .success-preview-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #bfd3e8;
      }

      .success-preview-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      body.is-lead-success-active .success-preview-actions {
        position: fixed;
        z-index: 200;
        top: 16px;
        right: 16px;
        padding: 8px;
        border: 1px solid rgba(143, 208, 255, 0.24);
        border-radius: 14px;
        background: rgba(6, 13, 25, 0.9);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(12px);
      }

      .success-preview-status {
        min-height: 1.4em;
        color: #8fd0ff;
        font-size: 0.86rem;
      }

      @media (max-width: 520px) {
        .success-preview-controls {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="successPreviewShell" class="success-preview-shell">
      <header class="success-preview-header">
        <span id="successPreviewOrigin" class="success-preview-origin" aria-label="Planeir">
          <img src="../assets/brand/planeir-wordmark-light.svg" alt="" width="1330" height="384" />
        </span>
      </header>

      <main class="success-preview-main">
        <section class="success-preview-panel" aria-labelledby="successPreviewHeading">
          <h1 id="successPreviewHeading">Success animation preview</h1>
          <p>Local-only controls for reviewing every harp trick without calling any production API.</p>

          <div class="success-preview-controls">
            <label class="success-preview-field" for="successPreviewTrick">
              Trick
              <select id="successPreviewTrick" data-testid="preview-trick">
                <option value="random">Random</option>
                <option value="backflip">Backflip</option>
                <option value="spin">Spin</option>
                <option value="flex">Flex</option>
                <option value="selfie">Selfie</option>
              </select>
            </label>

            <label class="success-preview-field" for="successPreviewVariant">
              Copy variant
              <select id="successPreviewVariant" data-testid="preview-variant">
                <option value="published">Completed call</option>
                <option value="request">Call request</option>
              </select>
            </label>
          </div>

          <label class="success-preview-toggle">
            <input id="successPreviewReducedMotion" type="checkbox" data-testid="preview-reduced-motion" />
            Simulate reduced motion
          </label>

          <div class="success-preview-actions">
            <button id="successPreviewPlay" class="ui-button" type="button" data-testid="preview-play">Play</button>
            <button id="successPreviewCancel" class="ui-button" type="button" data-testid="preview-cancel">Cancel and reset</button>
          </div>

          <p id="successPreviewStatus" class="success-preview-status" aria-live="polite">Ready.</p>
        </section>
      </main>
    </div>

    <div id="successPreviewOverlay" class="lead-success-overlay" aria-hidden="true">
      <div class="lead-success-stage">
        <div id="successPreviewTarget" class="lead-success-lockup" aria-hidden="true">
          <div class="lead-success-wordmark-shell">
            <img
              class="lead-success-stage-logo"
              src="../assets/brand/planeir-wordmark-no-harp-light.svg"
              alt=""
              width="1330"
              height="384"
            />
            <span class="lead-success-harp-character" aria-hidden="true">
              <span class="lead-success-harp-scale">
                <span class="lead-success-harp-motion">
                  <img
                    class="lead-success-harp-body"
                    src="../assets/brand/planeir-harp-light.svg"
                    alt=""
                    width="140"
                    height="136"
                  />
                </span>
              </span>
            </span>
          </div>
        </div>

        <div class="lead-success-copy" role="status" aria-live="polite">
          <h2 id="successPreviewTitle" class="lead-success-title">Congratulations</h2>
          <p id="successPreviewBody" class="lead-success-body">Thanks for using Planeir, your future self will thank you!</p>
        </div>
      </div>

      <div class="lead-success-timer" aria-hidden="true">
        <span class="lead-success-timer-bar"></span>
      </div>
    </div>

    <script type="module" src="./success_takeover_preview.js"></script>
  </body>
</html>
