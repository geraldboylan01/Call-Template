<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Confirm an application an AI assistant sent to Planeir for you." />
    <title>Confirm your application | Planeir</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
    <link rel="stylesheet" href="../../styles/landing.css" />
    <link rel="stylesheet" href="../../styles/apply.css" />
  </head>
  <body>
    <div class="landing-shell">
      <div class="landing-ambient landing-ambient-one" aria-hidden="true"></div>
      <div class="landing-ambient landing-ambient-two" aria-hidden="true"></div>
      <div class="landing-grid" aria-hidden="true"></div>

      <header class="site-header">
        <a class="site-brand" href="../../" aria-label="Planeir home">
          <span class="site-brand-logo-wrap" aria-hidden="true">
            <img
              class="site-brand-logo"
              src="../../assets/brand/planeir-lockup-light.svg"
              alt="Planeir logo"
              width="1330"
              height="384"
              decoding="async"
            />
          </span>
        </a>
      </header>

      <main class="apply-main">
        <section id="confirmResult" class="apply-card apply-done" tabindex="-1" aria-live="polite">
          <p id="confirmEyebrow" class="section-eyebrow">Your application</p>
          <h1 id="confirmTitle" class="apply-title">Confirming your application.</h1>
          <p id="confirmBody" class="apply-lede"></p>
          <p id="confirmNote" class="apply-card-intro" hidden></p>
          <a id="confirmAction" class="button button-primary" href="../../cases/" hidden>Watch the cases</a>
        </section>

        <noscript>
          <p class="apply-noscript">
            This page needs JavaScript to confirm your application. You can also email
            <a class="inline-link" href="mailto:hello@planeir.ie">hello@planeir.ie</a>.
          </p>
        </noscript>
      </main>

      <footer class="site-footer">
        <p class="site-footer-note">
          Planeir is educational only, not regulated financial advice.
          <a href="../../privacy/">Privacy</a> ·
          <a href="mailto:hello@planeir.ie">hello@planeir.ie</a>
        </p>
      </footer>
    </div>

    <script>
      window.__WORKER_BASE_URL = "https://api.planeir.ie";
    </script>
    <script type="module" src="../../js/apply_confirm.js"></script>
  </body>
</html>
