name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      activate_realtime_adviser_canary:
        description: Activate the invite-only Realtime adviser canary for this reviewed deployment
        required: false
        default: false
        type: boolean
      run_paid_realtime_infrastructure_proof:
        description: Prove real SDP, sideband tool execution, and server hang-up (required for activation)
        required: false
        default: false
        type: boolean
      run_paid_voice_provider_smoke:
        description: Run one paid TTS-to-transcription round trip after deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: worker-production
  # Never cancel a production activation run after it may have changed the
  # Worker configuration. A later run queues until the paid proof or the
  # compensating Realtime-only rollback has completed.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADVISOR_SMOKE_PASSWORD: ${{ secrets.ADVISOR_SMOKE_PASSWORD }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL || 'https://call-canvas-session-worker.geraldboylan.workers.dev' }}
      SMOKE_ORIGIN: ${{ vars.PUBLISHED_SMOKE_ORIGIN || 'https://planeir.ie' }}
      RUN_PAID_VOICE_PROVIDER_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid_voice_provider_smoke == true && 'true' || 'false' }}
      RUN_PAID_REALTIME_INFRASTRUCTURE_PROOF: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid_realtime_infrastructure_proof == true && 'true' || 'false' }}
      # Explicit source approval activates only the fixed adviser-test,
      # signed-invite, voice-assisted rules-only mode. The protected override may disable it
      # immediately; it can never activate a source-unapproved mode.
      CONSUMER_ADVISER_TEST_BETA_SOURCE_APPROVED: "true"
      CONSUMER_ADVISER_TEST_BETA_OVERRIDE: ${{ vars.CONSUMER_ADVISER_TEST_BETA_OVERRIDE }}
      # Realtime is a separately kill-switchable adviser canary layered on the
      # signed-invite beta. The committed Wrangler flag must remain false.
      # Ordinary pushes and default manual runs remain source-false. Realtime
      # can be source-approved only by an explicit protected manual dispatch,
      # and the validation step below then requires the paid infrastructure
      # proof in the same run.
      CONSUMER_REALTIME_ADVISER_CANARY_SOURCE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_realtime_adviser_canary == true && 'true' || 'false' }}
      CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE: ${{ vars.CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE }}
      # Standing approval: once the canary has been proof-activated by a manual
      # dispatch, this protected repository variable lets ordinary pushes keep
      # the LIVE activation instead of silently rolling Realtime back to false.
      # It can never switch Realtime on by itself: the validation step only
      # honors it when the currently deployed Worker already reports Realtime
      # enabled, and the OVERRIDE=false kill switch still wins.
      CONSUMER_REALTIME_KEEP_ACTIVE: ${{ vars.CONSUMER_REALTIME_KEEP_ACTIVE }}
      # Independent v2 rollout switch. It is effective only while the adviser
      # Realtime canary itself is active. The reviewed canary now defaults to
      # direct Marin conversation; setting the protected variable to false is
      # the immediate rollback to controlled v1 speech.
      CONSUMER_REALTIME_CONVERSATION_V2_ENABLED: ${{ vars.CONSUMER_REALTIME_CONVERSATION_V2_ENABLED || 'true' }}
      CONSUMER_DB_NAME: "planeir-consumer"
      CONSUMER_SITE_ZONE_NAME: "planeir.ie"
      CONSUMER_BETA_CONSENT_POLICY_VERSION: "consumer-adviser-test-v1"
      CONSUMER_BETA_CONSENT_MANIFEST_ID: "consumer-adviser-test-manifest-v1"
      CONSUMER_BETA_ANALYSIS_NOTICE_ID: "analysis-adviser-test-v1"
      CONSUMER_BETA_AI_NOTICE_ID: "ai-adviser-test-v1"
      CONSUMER_BETA_VOICE_NOTICE_ID: "voice-adviser-test-v1"
      CONSUMER_BETA_VOICE_DATA_POLICY_ID: "openai-audio-adviser-test-v1"
      CONSUMER_BETA_VOICE_TRANSCRIPTION_MODEL: "gpt-4o-mini-transcribe"
      CONSUMER_BETA_VOICE_SPEECH_MODEL: "tts-1-hd"
      CONSUMER_BETA_VOICE_NAME: "nova"
      CONSUMER_BETA_VOICE_PRICING_VERSION: "openai-audio-eur-safety-2026-07-13-v2"
      CONSUMER_BETA_VOICE_SESSION_BUDGET_EUR_CENTS: "200"
      CONSUMER_BETA_VOICE_DAILY_BUDGET_EUR_CENTS: "2000"
      CONSUMER_BETA_VOICE_TRANSCRIPTION_RESERVATION_EUR_CENTS: "10"
      CONSUMER_BETA_VOICE_SPEECH_RESERVATION_EUR_CENTS: "10"
      CONSUMER_BETA_REALTIME_NOTICE_ID: "realtime-voice-adviser-test-v2"
      CONSUMER_BETA_REALTIME_DATA_POLICY_ID: "openai-realtime-audio-adviser-test-v2"
      CONSUMER_BETA_REALTIME_MODEL: "gpt-realtime-2.1"
      CONSUMER_BETA_REALTIME_VOICE: "marin"
      CONSUMER_BETA_REALTIME_REASONING_EFFORT: "low"
      CONSUMER_BETA_REALTIME_TRANSCRIPTION_MODEL: "gpt-4o-mini-transcribe"
      CONSUMER_BETA_REALTIME_PROMPT_VERSION: "consumer-realtime-orchestrator-v8"
      CONSUMER_BETA_REALTIME_TOOLSET_VERSION: "consumer-realtime-tools-v6"
      CONSUMER_BETA_REALTIME_PRICING_VERSION: "openai-gpt-realtime-2.1-usd-parity-eur-safety-2026-07-14-v1"
      # Adviser-demo envelope: €10 per session (warn at €7.50) inside the
      # retained €50 UTC-day ceiling, 15-minute maximum meeting, 3-minute
      # silence timeout with a spoken warning 45 seconds beforehand.
      CONSUMER_BETA_REALTIME_SESSION_BUDGET_EUR_CENTS: "1000"
      CONSUMER_BETA_REALTIME_SESSION_WARN_EUR_CENTS: "750"
      CONSUMER_BETA_REALTIME_DAILY_BUDGET_EUR_CENTS: "5000"
      CONSUMER_BETA_REALTIME_MAX_DURATION_SECONDS: "900"
      CONSUMER_BETA_REALTIME_IDLE_TIMEOUT_SECONDS: "180"
      CONSUMER_BETA_REALTIME_SILENCE_PROMPT_SECONDS: "45"
      CONSUMER_BETA_REALTIME_MAX_SDP_BYTES: "32768"
      CONSUMER_BETA_REALTIME_MAX_RESPONSES: "40"
      CONSUMER_BETA_REALTIME_MAX_TOOL_CALLS: "24"
      # The conversation director phrases Worker-owned speech with a bounded
      # text-model pass (deterministic templates remain the fallback).
      CONSUMER_BETA_REALTIME_DIRECTOR_ENABLED: "true"
      # Current GPT-Realtime-2.1 USD prices are treated as equal euro amounts,
      # which is deliberately conservative for the application allowance.
      CONSUMER_BETA_REALTIME_TEXT_INPUT_EUR_MICROS_PER_MILLION: "4000000"
      CONSUMER_BETA_REALTIME_TEXT_CACHED_INPUT_EUR_MICROS_PER_MILLION: "400000"
      CONSUMER_BETA_REALTIME_TEXT_OUTPUT_EUR_MICROS_PER_MILLION: "24000000"
      CONSUMER_BETA_REALTIME_AUDIO_INPUT_EUR_MICROS_PER_MILLION: "32000000"
      CONSUMER_BETA_REALTIME_AUDIO_CACHED_INPUT_EUR_MICROS_PER_MILLION: "400000"
      CONSUMER_BETA_REALTIME_AUDIO_OUTPUT_EUR_MICROS_PER_MILLION: "64000000"
      # Realtime input transcription is a separately billed model call and is
      # reconciled inside the same session/day application allowance.
      CONSUMER_BETA_REALTIME_TRANSCRIPTION_INPUT_EUR_MICROS_PER_MILLION: "1250000"
      CONSUMER_BETA_REALTIME_TRANSCRIPTION_OUTPUT_EUR_MICROS_PER_MILLION: "5000000"
      CONSUMER_BETA_REALTIME_SPEECH_EUR_MICROS_PER_MILLION_CHARACTERS: "30000000"
      CONSUMER_BETA_HANDOFF_POLICY_VERSION: "consumer-adviser-handoff-v1"
      CONSUMER_BETA_HANDOFF_POLICY_URL: "https://planeir.ie/plan/privacy.html#handoff"
      CONSUMER_BETA_HANDOFF_RETENTION_POLICY_ID: "consumer-handoff-bridge-30d-v1"
      CONSUMER_BETA_HANDOFF_RETENTION_DAYS: "30"
      CONSUMER_BETA_PRIVACY_NOTICE_URL: "https://planeir.ie/plan/privacy.html"
      CONSUMER_BETA_SESSION_TTL_DAYS: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Validate deploy configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required in GitHub Settings > Secrets and variables > Actions"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required in GitHub Settings > Secrets and variables > Actions"; exit 1; }
          test -n "$WORKER_BASE_URL" || { echo "WORKER_BASE_URL is required"; exit 1; }
          test -n "$SMOKE_ORIGIN" || { echo "SMOKE_ORIGIN is required"; exit 1; }
          [[ "$CONSUMER_DB_NAME" == "planeir-consumer" ]] || { echo "CONSUMER_DB_NAME must remain planeir-consumer"; exit 1; }
          [[ "$CONSUMER_SITE_ZONE_NAME" == "planeir.ie" ]] || { echo "CONSUMER_SITE_ZONE_NAME must remain planeir.ie"; exit 1; }
          case "$CONSUMER_ADVISER_TEST_BETA_SOURCE_APPROVED" in
            false|true) ;;
            *) echo "CONSUMER_ADVISER_TEST_BETA_SOURCE_APPROVED must be exactly true or false"; exit 1 ;;
          esac
          case "$CONSUMER_ADVISER_TEST_BETA_OVERRIDE" in
            ""|false|true) ;;
            *) echo "CONSUMER_ADVISER_TEST_BETA_OVERRIDE must be empty, true, or false"; exit 1 ;;
          esac
          case "$CONSUMER_REALTIME_ADVISER_CANARY_SOURCE_APPROVED" in
            false|true) ;;
            *) echo "CONSUMER_REALTIME_ADVISER_CANARY_SOURCE_APPROVED must be exactly true or false"; exit 1 ;;
          esac
          case "$CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE" in
            ""|false|true) ;;
            *) echo "CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE must be empty, true, or false"; exit 1 ;;
          esac
          case "$CONSUMER_REALTIME_KEEP_ACTIVE" in
            ""|false|true) ;;
            *) echo "CONSUMER_REALTIME_KEEP_ACTIVE must be empty, true, or false"; exit 1 ;;
          esac
          case "$RUN_PAID_VOICE_PROVIDER_SMOKE" in
            false|true) ;;
            *) echo "RUN_PAID_VOICE_PROVIDER_SMOKE must be exactly true or false"; exit 1 ;;
          esac
          case "$RUN_PAID_REALTIME_INFRASTRUCTURE_PROOF" in
            false|true) ;;
            *) echo "RUN_PAID_REALTIME_INFRASTRUCTURE_PROOF must be exactly true or false"; exit 1 ;;
          esac
          if [[ "$CONSUMER_ADVISER_TEST_BETA_SOURCE_APPROVED" != "true" && "$CONSUMER_ADVISER_TEST_BETA_OVERRIDE" == "true" ]]; then
            echo "A protected override cannot activate a source-unapproved beta"
            exit 1
          fi
          if [[ "$CONSUMER_REALTIME_ADVISER_CANARY_SOURCE_APPROVED" != "true" && "$CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE" == "true" ]]; then
            echo "A protected override cannot activate a source-unapproved realtime canary"
            exit 1
          fi
          effective_beta="false"
          if [[ "$CONSUMER_ADVISER_TEST_BETA_SOURCE_APPROVED" == "true" && "$CONSUMER_ADVISER_TEST_BETA_OVERRIDE" != "false" ]]; then
            effective_beta="true"
          fi
          effective_realtime="false"
          realtime_standing_preserved="false"
          if [[ "$effective_beta" == "true" && "$CONSUMER_REALTIME_ADVISER_CANARY_SOURCE_APPROVED" == "true" && "$CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE" != "false" ]]; then
            effective_realtime="true"
          fi
          # A push must not silently roll back a proof-activated Realtime
          # canary. When the protected repository variable grants standing
          # approval AND the currently deployed Worker still reports Realtime
          # enabled, this push preserves the live activation. It cannot turn
          # Realtime on from a disabled state, and OVERRIDE=false still wins.
          if [[ "$effective_realtime" != "true" \
            && "$GITHUB_EVENT_NAME" == "push" \
            && "$CONSUMER_REALTIME_KEEP_ACTIVE" == "true" \
            && "$effective_beta" == "true" \
            && "$CONSUMER_REALTIME_ADVISER_CANARY_OVERRIDE" != "false" ]]; then
            live_realtime_enabled="$(
              curl -fsS --max-time 20 "$WORKER_BASE_URL/api/consumer/bootstrap" -H "Origin: $SMOKE_ORIGIN" \
                | node --input-type=module -e '
                    let raw = "";
                    process.stdin.on("data", (chunk) => { raw += chunk; });
                    process.stdin.on("end", () => {
                      let enabled = false;
                      try {
                        enabled = JSON.parse(raw)?.flags?.consumerRealtimeVoiceEnabled === true;
                      } catch (_error) {
                        enabled = false;
                      }
                      process.stdout.write(enabled ? "true" : "false");
                    });
                  '
            )" || live_realtime_enabled="false"
            if [[ "$live_realtime_enabled" == "true" ]]; then
              effective_realtime="true"
              realtime_standing_preserved="true"
              echo "Standing approval preserves the live Realtime adviser canary for this push deployment."
            else
              echo "Standing approval present but Realtime is not currently live; this push keeps Realtime disabled."
            fi
          fi
          if [[ "$effective_beta" == "true" ]]; then
            test -n "$ADVISOR_SMOKE_PASSWORD" || { echo "ADVISOR_SMOKE_PASSWORD is required for the authenticated adviser beta gate"; exit 1; }
            test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required in the protected GitHub production environment for adviser-test voice"; exit 1; }
            if [[ "$OPENAI_API_KEY" =~ [[:space:]] ]]; then
              echo "OPENAI_API_KEY must not contain whitespace"
              exit 1
            fi
          fi
          if [[ "$RUN_PAID_VOICE_PROVIDER_SMOKE" == "true" && "$effective_beta" != "true" ]]; then
            echo "The paid voice-provider smoke requires the protected adviser-test voice beta"
            exit 1
          fi
          if [[ "$effective_realtime" == "true" && "$realtime_standing_preserved" != "true" && "$RUN_PAID_REALTIME_INFRASTRUCTURE_PROOF" != "true" ]]; then
            echo "Realtime activation requires the paid SDP, sideband-tool, and server-hangup proof in the same manual deployment"
            exit 1
          fi
          if [[ "$RUN_PAID_REALTIME_INFRASTRUCTURE_PROOF" == "true" && "$effective_realtime" != "true" ]]; then
            echo "The paid Realtime infrastructure proof requires explicit canary activation in the same manual deployment"
            exit 1
          fi
          if [[ "$RUN_PAID_REALTIME_INFRASTRUCTURE_PROOF" == "true" && "$RUN_PAID_VOICE_PROVIDER_SMOKE" == "true" ]]; then
            echo "Run the Realtime infrastructure proof and the legacy bounded-voice provider smoke in separate disposable sessions"
            exit 1
          fi
          echo "CONSUMER_ADVISER_INVITE_BETA_ENABLED=$effective_beta" >> "$GITHUB_ENV"
          echo "CONSUMER_REALTIME_ADVISER_CANARY_ENABLED=$effective_realtime" >> "$GITHUB_ENV"
          echo "CONSUMER_REALTIME_STANDING_PRESERVED=$realtime_standing_preserved" >> "$GITHUB_ENV"
          if [[ "$effective_realtime" == "true" ]]; then
            echo "Effective consumer deployment mode: adviser-test-realtime-orchestrated-rules-only"
          elif [[ "$effective_beta" == "true" ]]; then
            echo "Effective consumer deployment mode: adviser-test-voice-assisted-rules-only"
          else
            echo "Effective consumer deployment mode: dormant"
          fi

      - name: Install Realtime canary browser harness
        if: env.CONSUMER_REALTIME_ADVISER_CANARY_ENABLED == 'true'
        run: npm install --no-package-lock --no-save --ignore-scripts playwright-core@1.61.1

      - name: Run full consumer and adviser regression gate
        run: |
          set -euo pipefail
          npm run check:consumer
          npm run check:house-purchase
          npm run check:module-media
          npm run check:video-summary
          npm run check:video-scene
          npm run check:codex-video-brief
          npm run check:success-animation
          npm run build
        env:
          ASSET_VERSION: ${{ github.sha }}

      - name: Install Wrangler
        run: npm install --global wrangler@4.110.0

      - name: Exercise consumer API against fresh local D1 bindings
        run: |
          set -euo pipefail
          state_dir=".worker-dry-run/consumer-http-deploy"
          rm -rf "$state_dir"
          mkdir -p "$state_dir"
          (
            cd worker
            wrangler d1 migrations apply LEADS_DB --local --config wrangler.consumer-test.toml --persist-to "../$state_dir"
            wrangler d1 migrations apply CONSUMER_DB --local --config wrangler.consumer-test.toml --persist-to "../$state_dir"
            wrangler dev --local --ip 127.0.0.1 --port 8788 --config wrangler.consumer-test.toml --persist-to "../$state_dir" --log-level warn --var CONSUMER_DATA_ENCRYPTION_KEY:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE --var CONSUMER_RATE_LIMIT_HASH_KEY:AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI --var CONSUMER_INVITE_SIGNING_KEY:AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
          ) >"$state_dir/wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/api/consumer/bootstrap >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$state_dir/wrangler.log"
              exit 1
            fi
            sleep 1
          done
          CONSUMER_INVITE_SIGNING_KEY=AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM npm run check:consumer-http

      - name: Resolve or provision the isolated consumer D1
        run: |
          set -euo pipefail
          resolve_database_id() {
            local inventory="$1"
            D1_INVENTORY="$inventory" node --input-type=module -e '
              const entries = JSON.parse(process.env.D1_INVENTORY || "[]");
              const matches = entries.filter((entry) => entry?.name === "planeir-consumer");
              if (matches.length > 1) {
                throw new Error("More than one D1 database has the exact name planeir-consumer.");
              }
              if (matches.length === 1) {
                const activationEnabled = process.env.CONSUMER_ADVISER_INVITE_BETA_ENABLED === "true";
                const jurisdiction = String(matches[0]?.jurisdiction || "").toLowerCase();
                if (activationEnabled && jurisdiction !== "eu") {
                  throw new Error("The existing planeir-consumer D1 must have the immutable EU jurisdiction before beta activation.");
                }
                const id = String(matches[0]?.uuid || matches[0]?.id || "");
                if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)) {
                  throw new Error("Cloudflare returned an invalid planeir-consumer D1 UUID.");
                }
                process.stdout.write(id);
              }
            '
          }

          inventory="$(wrangler d1 list --json)"
          database_id="$(resolve_database_id "$inventory")"
          if [[ -z "$database_id" && "$CONSUMER_ADVISER_INVITE_BETA_ENABLED" == "true" ]]; then
            wrangler d1 create planeir-consumer --jurisdiction eu
            inventory="$(wrangler d1 list --json)"
            database_id="$(resolve_database_id "$inventory")"
          fi
          if [[ "$CONSUMER_ADVISER_INVITE_BETA_ENABLED" == "true" && -z "$database_id" ]]; then
            echo "Cloudflare did not return the required planeir-consumer D1 after provisioning"
            exit 1
          fi
          if [[ -n "$database_id" ]]; then
            echo "CONSUMER_DB_ID=$database_id" >> "$GITHUB_ENV"
            echo "Resolved isolated consumer D1: planeir-consumer"
          else
            echo "No consumer D1 exists; retaining the dormant, unbound deployment."
          fi

      - name: Build fail-closed production Wrangler config
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const envValue = (name) => String(process.env[name] || '').trim();
          const databaseId = String(process.env.CONSUMER_DB_ID || '').trim();
          const databaseName = String(process.env.CONSUMER_DB_NAME || '').trim();
          const betaToggle = envValue('CONSUMER_ADVISER_INVITE_BETA_ENABLED');
          if (!['false', 'true'].includes(betaToggle)) {
            throw new Error('CONSUMER_ADVISER_INVITE_BETA_ENABLED must be exactly true or false.');
          }
          const betaEnabled = betaToggle === 'true';
          const realtimeToggle = envValue('CONSUMER_REALTIME_ADVISER_CANARY_ENABLED');
          if (!['false', 'true'].includes(realtimeToggle)) {
            throw new Error('CONSUMER_REALTIME_ADVISER_CANARY_ENABLED must be exactly true or false.');
          }
          const realtimeEnabled = realtimeToggle === 'true';
          const realtimeV2Toggle = envValue('CONSUMER_REALTIME_CONVERSATION_V2_ENABLED');
          if (!['false', 'true'].includes(realtimeV2Toggle)) {
            throw new Error('CONSUMER_REALTIME_CONVERSATION_V2_ENABLED must be exactly true or false.');
          }
          const realtimeV2Enabled = realtimeEnabled && realtimeV2Toggle === 'true';
          if (realtimeEnabled && !betaEnabled) {
            throw new Error('Realtime cannot be enabled outside the signed-invite adviser beta.');
          }
          if (databaseId && !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(databaseId)) {
            throw new Error('CONSUMER_DB_ID must be the UUID returned by Cloudflare D1.');
          }
          if (!/^[a-z0-9-]{1,64}$/.test(databaseName)) {
            throw new Error('CONSUMER_DB_NAME must contain only lowercase letters, numbers, and hyphens.');
          }

          const sourcePath = 'worker/wrangler.toml';
          const generatedPath = 'worker/wrangler.production.generated.toml';
          const bootstrapPath = 'worker/wrangler.bootstrap.generated.toml';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const leadsBinding = source.match(
            /\[\[d1_databases\]\]\s*\nbinding\s*=\s*"LEADS_DB"[\s\S]*?\ndatabase_id\s*=\s*"([0-9a-f-]+)"/i
          );
          if (!leadsBinding?.[1]) {
            throw new Error('The committed LEADS_DB binding could not be verified.');
          }
          if (databaseId && databaseId.toLowerCase() === leadsBinding[1].toLowerCase()) {
            throw new Error('CONSUMER_DB_ID must identify a different D1 database from LEADS_DB.');
          }
          const requiredFalseFlags = [
            'CONSUMER_JOURNEY_ENABLED',
            'CONSUMER_AI_INTAKE_ENABLED',
            'CONSUMER_VOICE_ENABLED',
            'CONSUMER_REALTIME_VOICE_ENABLED',
            'CONSUMER_REALTIME_CONVERSATION_V2_ENABLED',
            'CONSUMER_MODULE_ROUTING_ENABLED',
            'CONSUMER_GOAL_ROUTING_ENABLED',
            'CONSUMER_HANDOFF_ENABLED',
            'CONSUMER_PUBLIC_ACCESS_ENABLED'
          ];
          for (const flag of requiredFalseFlags) {
            const expression = new RegExp(`^${flag}\\s*=\\s*"false"\\s*$`, 'm');
            if (!expression.test(source)) {
              throw new Error(`${flag} must remain exactly false for production deployment.`);
            }
          }
          if (!/^CONSUMER_ALLOWED_MODULE_IDS\s*=\s*"house_purchase,liquidity_analysis"\s*$/m.test(source)) {
            throw new Error('The protected beta module allowlist must remain house_purchase,liquidity_analysis.');
          }
          if (!/^bindings\s*=\s*\[\s*\{\s*name\s*=\s*"CONSUMER_REALTIME_SESSIONS",\s*class_name\s*=\s*"ConsumerRealtimeSession"\s*\}\s*\]\s*$/m.test(source)) {
            throw new Error('The ConsumerRealtimeSession Durable Object binding must remain explicit.');
          }
          if (!/\[\[migrations\]\]\s*\ntag\s*=\s*"consumer_realtime_sessions_v1"\s*\nnew_sqlite_classes\s*=\s*\["ConsumerRealtimeSession"\]/m.test(source)) {
            throw new Error('The ConsumerRealtimeSession SQLite migration must remain explicit.');
          }

          const requiredPolicyVariables = [
            'CONSUMER_CONSENT_MANIFEST_ID',
            'CONSUMER_ANALYSIS_NOTICE_ID',
            'CONSUMER_AI_NOTICE_ID',
            'CONSUMER_VOICE_NOTICE_ID',
            'CONSUMER_PRIVACY_NOTICE_URL',
            'CONSUMER_AI_DATA_POLICY_ID',
            'CONSUMER_VOICE_DATA_POLICY_ID',
            'CONSUMER_VOICE_TRANSCRIPTION_MODEL',
            'CONSUMER_VOICE_SPEECH_MODEL',
            'CONSUMER_VOICE_NAME',
            'CONSUMER_VOICE_PRICING_VERSION',
            'CONSUMER_VOICE_SESSION_BUDGET_EUR_CENTS',
            'CONSUMER_VOICE_DAILY_BUDGET_EUR_CENTS',
            'CONSUMER_VOICE_TRANSCRIPTION_RESERVATION_EUR_CENTS',
            'CONSUMER_VOICE_SPEECH_RESERVATION_EUR_CENTS',
            'CONSUMER_REALTIME_NOTICE_ID',
            'CONSUMER_REALTIME_DATA_POLICY_ID',
            'CONSUMER_REALTIME_MODEL',
            'CONSUMER_REALTIME_VOICE',
            'CONSUMER_REALTIME_REASONING_EFFORT',
            'CONSUMER_REALTIME_TRANSCRIPTION_MODEL',
            'CONSUMER_REALTIME_PROMPT_VERSION',
            'CONSUMER_REALTIME_TOOLSET_VERSION',
            'CONSUMER_REALTIME_PRICING_VERSION',
            'CONSUMER_REALTIME_SESSION_BUDGET_EUR_CENTS',
            'CONSUMER_REALTIME_DAILY_BUDGET_EUR_CENTS',
            'CONSUMER_REALTIME_MAX_DURATION_SECONDS',
            'CONSUMER_REALTIME_IDLE_TIMEOUT_SECONDS',
            'CONSUMER_REALTIME_MAX_SDP_BYTES',
            'CONSUMER_REALTIME_MAX_RESPONSES',
            'CONSUMER_REALTIME_MAX_TOOL_CALLS',
            'CONSUMER_REALTIME_PLANNER_TIMEOUT_MS',
            'CONSUMER_REALTIME_PLANNER_CATCHUP_TIMEOUT_MS',
            'CONSUMER_REALTIME_PLANNER_MAX_OUTPUT_TOKENS',
            'CONSUMER_REALTIME_PLANNER_PROMPT_VERSION',
            'CONSUMER_REALTIME_DIRECTOR_ENABLED',
            'CONSUMER_REALTIME_TEXT_INPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_TEXT_CACHED_INPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_TEXT_OUTPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_AUDIO_INPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_AUDIO_CACHED_INPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_AUDIO_OUTPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_TRANSCRIPTION_INPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_TRANSCRIPTION_OUTPUT_EUR_MICROS_PER_MILLION',
            'CONSUMER_REALTIME_SPEECH_EUR_MICROS_PER_MILLION_CHARACTERS',
            'CONSUMER_HANDOFF_POLICY_VERSION',
            'CONSUMER_HANDOFF_POLICY_URL',
            'CONSUMER_HANDOFF_RETENTION_POLICY_ID',
            'CONSUMER_HANDOFF_RETENTION_DAYS'
          ];
          for (const variable of requiredPolicyVariables) {
            const expression = new RegExp(`^${variable}\\s*=`, 'm');
            if (!expression.test(source)) {
              throw new Error(`${variable} must be explicit so the runtime can fail closed.`);
            }
          }

          const originsMatch = source.match(/^ALLOWED_ORIGINS\s*=\s*"([^"]+)"\s*$/m);
          if (!originsMatch) throw new Error('ALLOWED_ORIGINS must be explicit.');
          for (const origin of originsMatch[1].split(',').map((value) => value.trim())) {
            const parsed = new URL(origin);
            if (parsed.protocol !== 'https:' || ['localhost', '127.0.0.1'].includes(parsed.hostname)) {
              throw new Error('Production ALLOWED_ORIGINS may contain only non-local HTTPS origins.');
            }
          }
          if (/^ALLOW_LOCAL_DEV_ORIGINS\s*=\s*"(?:1|true|yes|on)"\s*$/mi.test(source)) {
            throw new Error('ALLOW_LOCAL_DEV_ORIGINS must not be enabled in the production config.');
          }

          const replaceTomlString = (input, name, value) => {
            const expression = new RegExp('^' + name + '\\s*=\\s*"[^"\\n]*"\\s*$', 'gm');
            const matches = input.match(expression) || [];
            if (matches.length !== 1) {
              throw new Error(name + ' must have exactly one explicit string value in the source config.');
            }
            return input.replace(expression, name + ' = ' + JSON.stringify(value));
          };
          let generatedSource = source;
          if (betaEnabled) {
            if (!databaseId) {
              throw new Error('CONSUMER_DB_ID is required for the protected beta.');
            }
            const policyIds = {
              CONSUMER_CONSENT_POLICY_VERSION: envValue('CONSUMER_BETA_CONSENT_POLICY_VERSION'),
              CONSUMER_CONSENT_MANIFEST_ID: envValue('CONSUMER_BETA_CONSENT_MANIFEST_ID'),
              CONSUMER_ANALYSIS_NOTICE_ID: envValue('CONSUMER_BETA_ANALYSIS_NOTICE_ID'),
              CONSUMER_AI_NOTICE_ID: envValue('CONSUMER_BETA_AI_NOTICE_ID')
            };
            for (const [name, value] of Object.entries(policyIds)) {
              if (!/^[A-Za-z0-9._:-]{1,120}$/.test(value)) {
                throw new Error(name + ' must be a non-empty immutable policy identifier.');
              }
              generatedSource = replaceTomlString(generatedSource, name, value);
            }

            const fixedVoiceValues = {
              CONSUMER_VOICE_NOTICE_ID: ['CONSUMER_BETA_VOICE_NOTICE_ID', 'voice-adviser-test-v1'],
              CONSUMER_VOICE_DATA_POLICY_ID: ['CONSUMER_BETA_VOICE_DATA_POLICY_ID', 'openai-audio-adviser-test-v1'],
              CONSUMER_VOICE_TRANSCRIPTION_MODEL: ['CONSUMER_BETA_VOICE_TRANSCRIPTION_MODEL', 'gpt-4o-mini-transcribe'],
              CONSUMER_VOICE_SPEECH_MODEL: ['CONSUMER_BETA_VOICE_SPEECH_MODEL', 'tts-1-hd'],
              CONSUMER_VOICE_NAME: ['CONSUMER_BETA_VOICE_NAME', 'nova'],
              CONSUMER_VOICE_PRICING_VERSION: ['CONSUMER_BETA_VOICE_PRICING_VERSION', 'openai-audio-eur-safety-2026-07-13-v2'],
              CONSUMER_VOICE_SESSION_BUDGET_EUR_CENTS: ['CONSUMER_BETA_VOICE_SESSION_BUDGET_EUR_CENTS', '200'],
              CONSUMER_VOICE_DAILY_BUDGET_EUR_CENTS: ['CONSUMER_BETA_VOICE_DAILY_BUDGET_EUR_CENTS', '2000'],
              CONSUMER_VOICE_TRANSCRIPTION_RESERVATION_EUR_CENTS: ['CONSUMER_BETA_VOICE_TRANSCRIPTION_RESERVATION_EUR_CENTS', '10'],
              CONSUMER_VOICE_SPEECH_RESERVATION_EUR_CENTS: ['CONSUMER_BETA_VOICE_SPEECH_RESERVATION_EUR_CENTS', '10']
            };
            for (const [runtimeName, [sourceName, approvedValue]] of Object.entries(fixedVoiceValues)) {
              const value = envValue(sourceName);
              if (value !== approvedValue) {
                throw new Error(`${sourceName} must remain exactly ${approvedValue} for the protected adviser-test voice beta.`);
              }
              generatedSource = replaceTomlString(generatedSource, runtimeName, value);
            }

            const privacyNoticeUrl = envValue('CONSUMER_BETA_PRIVACY_NOTICE_URL');
            let parsedPrivacyUrl;
            try {
              parsedPrivacyUrl = new URL(privacyNoticeUrl);
            } catch (_error) {
              throw new Error('CONSUMER_BETA_PRIVACY_NOTICE_URL must be a valid HTTPS URL.');
            }
            if (
              parsedPrivacyUrl.protocol !== 'https:'
              || !['planeir.ie', 'www.planeir.ie'].includes(parsedPrivacyUrl.hostname)
              || parsedPrivacyUrl.pathname !== '/plan/privacy.html'
              || parsedPrivacyUrl.username
              || parsedPrivacyUrl.password
              || parsedPrivacyUrl.search
              || parsedPrivacyUrl.hash
            ) {
              throw new Error('CONSUMER_BETA_PRIVACY_NOTICE_URL must be the canonical Planéir consumer privacy page.');
            }

            const sessionTtl = envValue('CONSUMER_BETA_SESSION_TTL_DAYS');
            const parsedSessionTtl = Number.parseInt(sessionTtl, 10);
            if (
              !/^[1-9][0-9]*$/.test(sessionTtl)
              || !Number.isInteger(parsedSessionTtl)
              || parsedSessionTtl < 1
              || parsedSessionTtl > 90
            ) {
              throw new Error('CONSUMER_BETA_SESSION_TTL_DAYS must be an integer from 1 to 90.');
            }

            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_PRIVACY_NOTICE_URL', parsedPrivacyUrl.toString());
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_SESSION_TTL_DAYS', String(parsedSessionTtl));
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_COHORT', 'adviser_test');
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_INVITE_MAX_TTL_HOURS', '24');
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_JOURNEY_ENABLED', 'true');
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_VOICE_ENABLED', 'true');
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_MODULE_ROUTING_ENABLED', 'true');
            generatedSource = replaceTomlString(generatedSource, 'CONSUMER_GOAL_ROUTING_ENABLED', 'true');

            if (realtimeEnabled) {
              const fixedRealtimeValues = {
                CONSUMER_REALTIME_NOTICE_ID: ['CONSUMER_BETA_REALTIME_NOTICE_ID', 'realtime-voice-adviser-test-v2'],
                CONSUMER_REALTIME_DATA_POLICY_ID: ['CONSUMER_BETA_REALTIME_DATA_POLICY_ID', 'openai-realtime-audio-adviser-test-v2'],
                CONSUMER_REALTIME_MODEL: ['CONSUMER_BETA_REALTIME_MODEL', 'gpt-realtime-2.1'],
                CONSUMER_REALTIME_VOICE: ['CONSUMER_BETA_REALTIME_VOICE', 'marin'],
                CONSUMER_REALTIME_REASONING_EFFORT: ['CONSUMER_BETA_REALTIME_REASONING_EFFORT', 'low'],
                CONSUMER_REALTIME_TRANSCRIPTION_MODEL: ['CONSUMER_BETA_REALTIME_TRANSCRIPTION_MODEL', 'gpt-4o-mini-transcribe'],
                CONSUMER_REALTIME_PROMPT_VERSION: ['CONSUMER_BETA_REALTIME_PROMPT_VERSION', 'consumer-realtime-orchestrator-v8'],
                CONSUMER_REALTIME_TOOLSET_VERSION: ['CONSUMER_BETA_REALTIME_TOOLSET_VERSION', 'consumer-realtime-tools-v6'],
                CONSUMER_REALTIME_PRICING_VERSION: ['CONSUMER_BETA_REALTIME_PRICING_VERSION', 'openai-gpt-realtime-2.1-usd-parity-eur-safety-2026-07-14-v1'],
                CONSUMER_REALTIME_SESSION_BUDGET_EUR_CENTS: ['CONSUMER_BETA_REALTIME_SESSION_BUDGET_EUR_CENTS', '1000'],
                CONSUMER_REALTIME_SESSION_WARN_EUR_CENTS: ['CONSUMER_BETA_REALTIME_SESSION_WARN_EUR_CENTS', '750'],
                CONSUMER_REALTIME_DAILY_BUDGET_EUR_CENTS: ['CONSUMER_BETA_REALTIME_DAILY_BUDGET_EUR_CENTS', '5000'],
                CONSUMER_REALTIME_MAX_DURATION_SECONDS: ['CONSUMER_BETA_REALTIME_MAX_DURATION_SECONDS', '900'],
                CONSUMER_REALTIME_IDLE_TIMEOUT_SECONDS: ['CONSUMER_BETA_REALTIME_IDLE_TIMEOUT_SECONDS', '180'],
                CONSUMER_REALTIME_SILENCE_PROMPT_SECONDS: ['CONSUMER_BETA_REALTIME_SILENCE_PROMPT_SECONDS', '45'],
                CONSUMER_REALTIME_MAX_SDP_BYTES: ['CONSUMER_BETA_REALTIME_MAX_SDP_BYTES', '32768'],
                CONSUMER_REALTIME_MAX_RESPONSES: ['CONSUMER_BETA_REALTIME_MAX_RESPONSES', '40'],
                CONSUMER_REALTIME_MAX_TOOL_CALLS: ['CONSUMER_BETA_REALTIME_MAX_TOOL_CALLS', '24'],
                CONSUMER_REALTIME_DIRECTOR_ENABLED: ['CONSUMER_BETA_REALTIME_DIRECTOR_ENABLED', 'true'],
                CONSUMER_REALTIME_TEXT_INPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_TEXT_INPUT_EUR_MICROS_PER_MILLION', '4000000'],
                CONSUMER_REALTIME_TEXT_CACHED_INPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_TEXT_CACHED_INPUT_EUR_MICROS_PER_MILLION', '400000'],
                CONSUMER_REALTIME_TEXT_OUTPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_TEXT_OUTPUT_EUR_MICROS_PER_MILLION', '24000000'],
                CONSUMER_REALTIME_AUDIO_INPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_AUDIO_INPUT_EUR_MICROS_PER_MILLION', '32000000'],
                CONSUMER_REALTIME_AUDIO_CACHED_INPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_AUDIO_CACHED_INPUT_EUR_MICROS_PER_MILLION', '400000'],
                CONSUMER_REALTIME_AUDIO_OUTPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_AUDIO_OUTPUT_EUR_MICROS_PER_MILLION', '64000000'],
                CONSUMER_REALTIME_TRANSCRIPTION_INPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_TRANSCRIPTION_INPUT_EUR_MICROS_PER_MILLION', '1250000'],
                CONSUMER_REALTIME_TRANSCRIPTION_OUTPUT_EUR_MICROS_PER_MILLION: ['CONSUMER_BETA_REALTIME_TRANSCRIPTION_OUTPUT_EUR_MICROS_PER_MILLION', '5000000'],
                CONSUMER_REALTIME_SPEECH_EUR_MICROS_PER_MILLION_CHARACTERS: ['CONSUMER_BETA_REALTIME_SPEECH_EUR_MICROS_PER_MILLION_CHARACTERS', '30000000']
              };
              for (const [runtimeName, [sourceName, approvedValue]] of Object.entries(fixedRealtimeValues)) {
                const value = envValue(sourceName);
                if (value !== approvedValue) {
                  throw new Error(`${sourceName} must remain exactly ${approvedValue} for the protected realtime canary.`);
                }
                generatedSource = replaceTomlString(generatedSource, runtimeName, value);
              }
              generatedSource = replaceTomlString(generatedSource, 'CONSUMER_REALTIME_VOICE_ENABLED', 'true');
              generatedSource = replaceTomlString(
                generatedSource,
                'CONSUMER_REALTIME_CONVERSATION_V2_ENABLED',
                realtimeV2Enabled ? 'true' : 'false'
              );
              generatedSource = replaceTomlString(generatedSource, 'CONSUMER_HANDOFF_ENABLED', 'false');
            }
          }

          const expectedGeneratedFlags = {
            CONSUMER_JOURNEY_ENABLED: betaEnabled ? 'true' : 'false',
            CONSUMER_VOICE_ENABLED: betaEnabled ? 'true' : 'false',
            CONSUMER_REALTIME_VOICE_ENABLED: realtimeEnabled ? 'true' : 'false',
            CONSUMER_REALTIME_CONVERSATION_V2_ENABLED: realtimeV2Enabled ? 'true' : 'false',
            CONSUMER_MODULE_ROUTING_ENABLED: betaEnabled ? 'true' : 'false',
            CONSUMER_GOAL_ROUTING_ENABLED: betaEnabled ? 'true' : 'false',
            CONSUMER_AI_INTAKE_ENABLED: 'false',
            CONSUMER_HANDOFF_ENABLED: 'false',
            CONSUMER_PUBLIC_ACCESS_ENABLED: 'false'
          };
          for (const [flag, value] of Object.entries(expectedGeneratedFlags)) {
            const expression = new RegExp('^' + flag + '\\s*=\\s*"' + value + '"\\s*$', 'm');
            if (!expression.test(generatedSource)) {
              throw new Error('Generated deployment mode has an unsafe ' + flag + ' value.');
            }
          }

          const binding = databaseId ? [
            '',
            '# Generated by deploy-worker.yml from the protected production environment.',
            '[[d1_databases]]',
            'binding = "CONSUMER_DB"',
            `database_name = ${JSON.stringify(databaseName)}`,
            `database_id = ${JSON.stringify(databaseId)}`,
            'migrations_dir = "consumer-migrations"',
            ''
          ].join('\n') : '\n';
          fs.writeFileSync(generatedPath, generatedSource.trimEnd() + '\n' + binding, { mode: 0o600 });
          const bootstrapSource = replaceTomlString(
            replaceTomlString(
              replaceTomlString(
                generatedSource,
                'CONSUMER_REALTIME_CONVERSATION_V2_ENABLED',
                'false'
              ),
              'CONSUMER_REALTIME_VOICE_ENABLED',
              'false'
            ),
            'CONSUMER_HANDOFF_ENABLED',
            'false'
          );
          if (!/^CONSUMER_REALTIME_VOICE_ENABLED\s*=\s*"false"\s*$/m.test(bootstrapSource)) {
            throw new Error('The infrastructure bootstrap config must keep realtime voice disabled.');
          }
          if (!/^CONSUMER_REALTIME_CONVERSATION_V2_ENABLED\s*=\s*"false"\s*$/m.test(bootstrapSource)) {
            throw new Error('The infrastructure bootstrap config must keep conversational realtime v2 disabled.');
          }
          if (!/^CONSUMER_HANDOFF_ENABLED\s*=\s*"false"\s*$/m.test(bootstrapSource)) {
            throw new Error('The infrastructure bootstrap config must keep the realtime handoff disabled.');
          }
          fs.writeFileSync(bootstrapPath, bootstrapSource.trimEnd() + '\n' + binding, { mode: 0o600 });
          NODE

      - name: Replay adviser and consumer migrations in fresh local D1 state
        working-directory: ./worker
        run: |
          set -euo pipefail
          rm -rf ../.worker-dry-run/deploy-local-d1
          wrangler d1 migrations apply LEADS_DB --local --config wrangler.production.generated.toml --persist-to ../.worker-dry-run/deploy-local-d1
          if [[ -n "$CONSUMER_DB_ID" ]]; then
            wrangler d1 migrations apply CONSUMER_DB --local --config wrangler.production.generated.toml --persist-to ../.worker-dry-run/deploy-local-d1
          else
            echo "CONSUMER_DB_ID is not configured; preserving the dormant, unbound consumer capability."
          fi

      - name: Bundle production Worker without deploying
        working-directory: ./worker
        run: |
          set -euo pipefail
          wrangler deploy --dry-run --config wrangler.bootstrap.generated.toml --outdir ../.worker-dry-run/deploy-bootstrap-bundle
          wrangler deploy --dry-run --config wrangler.production.generated.toml --outdir ../.worker-dry-run/deploy-bundle

      - name: Upsert protected-beta response security headers
        if: env.CONSUMER_ADVISER_INVITE_BETA_ENABLED == 'true'
        run: node ./scripts/upsert-consumer-plan-headers.mjs

      - name: Verify protected-beta static security headers
        if: env.CONSUMER_ADVISER_INVITE_BETA_ENABLED == 'true'
        run: node ./scripts/check-consumer-static-headers.mjs

      - name: Apply remote adviser D1 migrations
        working-directory: ./worker
        run: wrangler d1 migrations apply LEADS_DB --remote --config wrangler.production.generated.toml

      - name: Apply remote consumer D1 migrations
        working-directory: ./worker
        run: |
          set -euo pipefail
          if [[ -n "$CONSUMER_DB_ID" ]]; then
            wrangler d1 migrations apply CONSUMER_DB --remote --config wrangler.production.generated.toml
          else
            echo "CONSUMER_DB_ID is not configured; skipping consumer migrations while all consumer flags are false."
          fi

      # The first realtime release introduces a new Durable Object class and
      # migration. Deploy the reviewed code with only realtime held false before
      # any `secret put`; a failed bootstrap prevents every secret mutation and
      # the final activation. Existing bounded voice and invite controls retain
      # their generated values in this bootstrap config.
      - name: Deploy Worker code and Durable Object bootstrap
        if: env.CONSUMER_ADVISER_INVITE_BETA_ENABLED == 'true'
        working-directory: ./worker
        run: wrangler deploy --config wrangler.bootstrap.generated.toml

      # Wrangler 4.110 `secret put` deploys a secret-only version immediately.
      # Use the bootstrap config so realtime stays disabled throughout secret
      # reconciliation; only the final production deploy may activate it.
      - name: Ensure protected-beta Worker secrets and provider credential
        if: env.CONSUMER_ADVISER_INVITE_BETA_ENABLED == 'true'
        working-directory: ./worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          secret_inventory="$(wrangler secret list --config wrangler.bootstrap.generated.toml --format json)"
          mapfile -t missing_secrets < <(
            SECRET_INVENTORY="$secret_inventory" node --input-type=module -e '
              const entries = JSON.parse(process.env.SECRET_INVENTORY || "[]");
              const names = new Set(entries.map((entry) => String(entry?.name || "")));
              const required = [
                "CONSUMER_DATA_ENCRYPTION_KEY",
                "CONSUMER_RATE_LIMIT_HASH_KEY",
                "CONSUMER_INVITE_SIGNING_KEY"
              ];
              process.stdout.write(required.filter((name) => !names.has(name)).join("\n"));
            '
          )
          for secret_name in "${missing_secrets[@]}"; do
            [[ -n "$secret_name" ]] || continue
            secret_value="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            [[ "$secret_value" =~ ^[A-Za-z0-9_-]{43}$ ]] || { echo "Generated consumer secret has an invalid format"; exit 1; }
            printf '%s' "$secret_value" | wrangler secret put "$secret_name" --config wrangler.bootstrap.generated.toml
            unset secret_value
            echo "Created missing Worker secret: $secret_name"
          done

          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is required for adviser-test voice"; exit 1; }
          printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --config wrangler.bootstrap.generated.toml
          unset OPENAI_API_KEY
          echo "Provisioned the protected OpenAI provider credential without exposing its value."

          secret_inventory="$(wrangler secret list --config wrangler.bootstrap.generated.toml --format json)"
          SECRET_INVENTORY="$secret_inventory" node --input-type=module -e '
            const entries = JSON.parse(process.env.SECRET_INVENTORY || "[]");
            const names = new Set(entries.map((entry) => String(entry?.name || "")));
            const required = [
              "CONSUMER_DATA_ENCRYPTION_KEY",
              "CONSUMER_RATE_LIMIT_HASH_KEY",
              "CONSUMER_INVITE_SIGNING_KEY",
              "OPENAI_API_KEY"
            ];
            const missing = required.filter((name) => !names.has(name));
            if (missing.length) throw new Error(`Protected beta Worker secrets are missing: ${missing.join(", ")}`);
            console.log("Verified required protected-beta Worker secret names without rotating existing values.");
          '

      - name: Deploy final Worker configuration
        working-directory: ./worker
        run: |
          set -euo pipefail
          if [[ "$CONSUMER_REALTIME_ADVISER_CANARY_ENABLED" == "true" ]]; then
            # Record the activation attempt before the external deploy starts.
            # If Wrangler fails or this job is cancelled after Cloudflare has
            # accepted the config, the compensating step must assume Realtime
            # may be live and restore the source-false bootstrap config.
            echo "CONSUMER_REALTIME_ACTIVATION_DEPLOY_ATTEMPTED=true" >> "$GITHUB_ENV"
          fi
          wrangler deploy --config wrangler.production.generated.toml

      - name: Verify live consumer deployment mode
        run: |
          set -euo pipefail
          if [[ "$CONSUMER_REALTIME_ADVISER_CANARY_ENABLED" == "true" ]]; then
            export CONSUMER_EXPECTED_DEPLOYMENT_MODE="realtime_voice_rules_only"
          elif [[ "$CONSUMER_ADVISER_INVITE_BETA_ENABLED" == "true" ]]; then
            export CONSUMER_EXPECTED_DEPLOYMENT_MODE="voice_assisted_rules_only"
          else
            export CONSUMER_EXPECTED_DEPLOYMENT_MODE="dormant"
          fi
          node ./scripts/check-consumer-live-deployment.mjs

      - name: Smoke check authenticated adviser planning bridge
        if: env.CONSUMER_ADVISER_INVITE_BETA_ENABLED == 'true'
        run: node ./scripts/check-consumer-live-advisor-bridge.mjs

      - name: Smoke check live published-session routes
        run: node ./scripts/check-worker-published-session-routes.mjs

      # A canary that cannot prove the real provider boundary must not remain
      # active. This compensating deploy preserves the existing adviser beta,
      # D1 data, and secrets while restoring only Realtime to source-false.
      - name: Roll back Realtime after a failed live canary proof
        if: (failure() || cancelled()) && env.CONSUMER_REALTIME_ACTIVATION_DEPLOY_ATTEMPTED == 'true'
        working-directory: ./worker
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.bootstrap.generated.toml
          CONSUMER_EXPECTED_DEPLOYMENT_MODE=voice_assisted_rules_only \
            node ../scripts/check-consumer-live-deployment.mjs

      - name: Remove generated deployment config
        if: always()
        run: rm -f worker/wrangler.bootstrap.generated.toml worker/wrangler.production.generated.toml
